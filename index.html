<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Está llegando Orbitando. Un nuevo sitio está en órbita. Pronto aterrizamos."
    />
    <meta property="og:title" content="Orbitando — está llegando" />
    <meta
      property="og:description"
      content="Un nuevo sitio está en órbita. Pronto aterrizamos."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f3f3f3" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('orbitando-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#070708' : '#f3f3f3')
          var icon = document.querySelector('link[rel="icon"]')
          if (icon && theme === 'dark') {
            icon.setAttribute('href', '%BASE_URL%favicon-dark.svg')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Orbitando — está llegando</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
